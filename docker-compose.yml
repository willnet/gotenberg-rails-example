services:
  web:
    build:
      context: .
      target: development
    command: bin/rails server -b 0.0.0.0
    environment:
      GOTENBERG_ENDPOINT: http://gotenberg:3000
      PDF_DISPLAY_BASE_URL: http://web:3000
      RAILS_ENV: development
    volumes:
      - .:/rails
      - bundle:/usr/local/bundle
    ports:
      - "3000:3000"
    depends_on:
      - gotenberg

  gotenberg:
    image: gotenberg/gotenberg:8
    ports:
      - "3001:3000"

volumes:
  bundle:
